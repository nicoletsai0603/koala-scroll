<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小熊加鈣繪本</title>
<meta name="description" content="樂天小熊新配方：營養加鈣、美味加分。捲動翻頁的互動繪本。">
<style>
  :root { --ink:#5b3a40; --paper:#fffaf0; --k:1; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  /* 跟樂天原版一樣：白色頁面，中間一條 700px 寬的直式畫面，沒有卡片、陰影或模糊背景 */
  body {
    background:#fff; color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 每一幕：外框提供捲動距離，pin 釘住畫面 ---------- */
  .act { position:relative; }               /* 高度由 data-len 決定 */
  .pin { position:sticky; top:0; height:100vh; height:100svh; overflow:hidden; perspective:1800px; }
  .stage {
    position:absolute; left:50%; top:50%;
    width:700px; height:1000px;
    transform:translate(-50%,-50%) scale(var(--k)) rotateX(calc(var(--my, 0) * -2.2deg)) rotateY(calc(var(--mx, 0) * 2.6deg));   /* 跟著游標微微傾斜 */
    overflow:hidden; border-radius:0;
    background:#fff;
  }
  /* 游標視差：--mx/--my 是游標位置（-1~1），--d 是這一層的深度（最多移動幾 px；負值＝往反方向，看起來比較遠） */
  [data-d] { translate:calc(var(--mx, 0) * var(--d) * 1px) calc(var(--my, 0) * var(--d) * 1px); }
  .G { position:absolute; inset:0; background:#fff; }   /* 一幕裡的一個鏡頭；data-a~data-b 是它出現的進度範圍 */
  .zz { font-weight:900; font-style:italic; color:#fff; -webkit-text-stroke:6px #4c3643; paint-order:stroke fill; line-height:1; transform-origin:50% 50% !important; opacity:0; }
  .leaf { width:30px; height:19px; background:#8fc31f; border:3px solid #4d8f1f; border-radius:0 85% 0 85%; transform-origin:50% 50% !important; opacity:0; }
  .L { position:absolute; left:0; top:0; display:block; transform-origin:0 0; will-change:transform,opacity; user-select:none; -webkit-user-drag:none; }
  .W { position:absolute; left:0; width:700px; transform-origin:0 0; will-change:transform; }
  .W > img:not(.L) { position:absolute; left:0; top:0; width:700px; display:block; }
  .pop { transform-origin:50% 100%; }

  /* ---------- 字幕 ---------- */
  .cap {
    position:absolute; left:50%; width:max-content; max-width:620px;
    transform:translate(-50%,0); opacity:0;
    margin:0; padding:16px 28px; border-radius:22px;
    background:rgba(255,250,240,.94); color:var(--ink);
    font-size:30px; line-height:1.5; font-weight:700; letter-spacing:.04em; text-align:center;
    box-shadow:0 6px 22px rgba(60,40,30,.14);
    pointer-events:none; z-index:50;
  }
  .hint {
    position:absolute; left:50%; bottom:40px; transform:translateX(-50%);
    font-size:24px; font-weight:700; color:#fff; letter-spacing:.08em;
    background:rgba(40,80,110,.55); padding:10px 26px; border-radius:999px; z-index:60;
    animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform:translate(-50%,8px); } }

  /* ---------- 鈣量表 ---------- */
  .meter { position:absolute; left:110px; top:880px; width:480px; z-index:40; opacity:0; }
  .meter .lab { display:flex; justify-content:space-between; font-size:26px; font-weight:800; margin-bottom:8px; }
  .meter .bar { height:22px; border-radius:999px; background:#efe3c4; border:3px solid var(--ink); overflow:hidden; }
  .meter .fill { height:100%; width:0; background:linear-gradient(90deg,#9fd3f5,#1d6fbf); }

  /* ---------- 第 3 幕：運動三格 ---------- */
  .panel { position:absolute; left:194px; width:312px; height:312px; border-radius:18px; overflow:hidden; }
  .panel img { position:absolute; left:0; top:0; width:312px; }

  /* ---------- 頁首與章節導覽 ---------- */
  .top {
    position:fixed; left:0; right:0; top:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 22px; pointer-events:none;
  }
  .brand { font-weight:800; letter-spacing:.08em; font-size:15px; background:rgba(255,250,240,.9); padding:8px 16px; border-radius:999px; pointer-events:auto; box-shadow:0 4px 14px rgba(60,40,30,.1); }
  .snd { font:inherit; font-weight:800; font-size:15px; letter-spacing:.04em; color:inherit; background:rgba(255,250,240,.9); padding:8px 16px; border:0; border-radius:999px; pointer-events:auto; cursor:pointer; box-shadow:0 4px 14px rgba(60,40,30,.1); white-space:nowrap; }
  .snd[aria-pressed="true"] { background:#ffe14d; }
  .snd:focus-visible { outline:3px solid #2a6fb8; outline-offset:2px; }
  .progress { position:fixed; left:0; top:0; height:4px; width:100%; z-index:101; background:transparent; }
  .progress i { display:block; height:100%; width:0; background:#e9573f; }
  .chapters {
    position:fixed; right:22px; top:50%; transform:translateY(-50%); z-index:100;
    display:flex; flex-direction:column; gap:10px;
  }
  .chapters button {
    appearance:none; border:0; cursor:pointer; font:inherit; font-size:14px; font-weight:700;
    display:flex; align-items:center; gap:10px; justify-content:flex-end;
    background:rgba(255,250,240,.85); color:var(--ink); padding:7px 14px 7px 16px; border-radius:999px;
    box-shadow:0 3px 10px rgba(60,40,30,.1); transition:background .25s, color .25s;
  }
  .chapters button b { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:#f1e6cc; font-size:12px; }
  .chapters button.on { background:var(--ink); color:#fff; }
  .chapters button.on b { background:#e9573f; color:#fff; }
  .chapters button:focus-visible { outline:3px solid #e9573f; outline-offset:2px; }

  .end-btn {
    position:absolute; left:50%; top:760px; transform:translateX(-50%);
    appearance:none; border:3px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer;
    font:inherit; font-size:26px; font-weight:800; padding:14px 34px; border-radius:999px;
  }

  .chapters button { white-space:nowrap; }
  @media (max-width: 820px) {
    .top { padding:10px 12px; }
    .brand { font-size:13px; padding:6px 12px; }
    .chapters { top:auto; bottom:14px; right:50%; transform:translateX(50%); flex-direction:row; gap:6px; }
    .chapters button { padding:6px; font-size:0; gap:0; }
    .chapters button b { width:26px; height:26px; font-size:13px; }
    .chapters button.on { padding:6px 12px 6px 6px; font-size:13px; gap:6px; }
  }
  @media (prefers-reduced-motion: reduce) { .hint { animation:none; } }
</style>
</head>

<script>
(() => {
  /* ---------- 小工具 ---------- */
  const $ = id => document.getElementById(id);
  const clamp = x => Math.min(1, Math.max(0, x));
  const seg = (p, a, b) => clamp((p - a) / (b - a));          // 把 p 在 a~b 之間換算成 0~1
  const lerp = (a, b, t) => a + (b - a) * t;
  const E = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;   // 緩入緩出
  const out = t => 1 - Math.pow(1 - t, 3);
  const back = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 + 2.70158*Math.pow(t-1,3) + 1.70158*Math.pow(t-1,2); // 彈出
  const bounce = t => { const n=7.5625,d=2.75; if(t<1/d) return n*t*t; if(t<2/d) return n*(t-=1.5/d)*t+.75; if(t<2.5/d) return n*(t-=2.25/d)*t+.9375; return n*(t-=2.625/d)*t+.984375; };
  const T = (el, x=0, y=0, s=1, r=0) => { if (!el) return; el.style.transform = `translate3d(${x}px,${y}px,0) scale(${s}) rotate(${r}deg)`; };
  const O = (el, o) => { if (!el) return; el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'; };
  const frame = (wrap, i) => wrap && [...wrap.children].forEach((im, k) => { if (im.tagName === 'IMG') im.style.visibility = k === i ? 'visible' : 'hidden'; });
  const pop = (el, t) => { T(el, 0, 0, back(t)); O(el, t > 0 ? 1 : 0); };                 // 對話框彈出
  const reveal = (el, t) => { if (el) el.style.clipPath = `inset(0 0 ${(100 - 100 * t).toFixed(1)}% 0)`; };   // 由上往下畫出來（腳印）

  /* ---------- 每一幕的動畫：p = 這一幕的捲動進度 0~1 ---------- */
  const makeScenes = ($, root, dropEls, vid) => ({
    act1(p) {
      const q = seg(p, 0, .66);                                                               // 鏡頭從天空降到森林
      T($('a1sky'), 0, -300 * q);
      const cy = 420 - 1000 * E(seg(q, 0, .55));
      T($('a1cloud'), 0, cy);                                                                  // 遠：慢
      T($('a1haze'), 0, cy + 742);
      T($('a1mtn'),   0, 1300 - 900 * E(seg(q, .06, .4)) - 1100 * E(seg(q, .4, .72)));     // 中
      T($('a1bush'),  0, 1400 - 850 * E(seg(q, .12, .42)) - 1300 * E(seg(q, .42, .72)));   // 近：快
      // 森林這一景（森林底圖＋樹冠＋光＋小熊）照原版的相對位置鎖在一起，整組接在樹叢下面升上來：
      // 樹冠蓋住森林底圖上半的天空，樹叢蓋住樹冠頂端的缺口，中途不會露出平平的接縫
      const bushY = 1400 - 850 * E(seg(q, .12, .42)) - 1300 * E(seg(q, .42, .72));
      const ty = Math.max(-300, bushY + 308);
      T($('a1forest'),0, ty + 180);
      T($('a1trees'), 0, ty);
      T($('a1light'), 0, ty + 300);                                                            // 樹梢灑下來的光
      O($('a1light'), .85 * (1 - clamp((ty + 300) / 220)));                                    // 光的上緣是平的，快到定位才淡入，免得中途露出一條線
      T($('a1bear'),  0, ty + 482);
      // 小鳥從樹梢左右飄著掉下來，跟原版一樣落在小熊前面地上那塊光圈裡
      const t = seg(q, .72, .97);
      T($('a1bird'),
        lerp(500, 270, t * t) + 70 * Math.sin(t * 3 * Math.PI) * (1 - t),               // 先在小熊右邊飄，最後落到地上
        lerp(-180, 662, t * t * (3 - 2 * t)),
        1, 32 * Math.sin(t * 4 * Math.PI) * (1 - t));
      O($('a1bird'), t > 0 ? 1 : 0);
      O($('hint'), 1 - seg(p, 0, .04));
      // 小熊捧著小鳥，抬頭看高高的鳥巢
      const b = E(seg(p, .66, 1));
      // 滾動視差：鏡頭往下移時，三層用不同速度往上跑——背景最慢（遠）、樹幹和鳥巢較快、最前面的樹葉最快（近）
      // 三層都放大一點、四邊留出餘量，游標視差移動時才不會露出邊緣（背景 5%、樹幹 6%、樹葉 8%）
      T($('a1hold'), -17.5, -20 - 320 * b, 1.05);            // 遠：只移動 320
      T($('a1tree'), -21, 330 - 610 * b, 1.06);              // 中：移動 610；停住時底邊仍超出畫面底，不會露出被切平的樹根
      T($('a1leaf'), 0, -30 - 860 * b, 1.08 + .25 * b);      // 近：移動 860，還邊移邊放大
    },
    act2(p) {
      // 爬上去 → 抱住 → 滑下來，三格眼淚交替
      const c = seg(p, 0, .3);
      const y = c < .35 ? lerp(640, 230, E(c / .35)) : c < .5 ? 230 : lerp(230, 600, E((c - .5) / .5));
      T($('b2bear'), 125 + (c > .5 ? 6 * Math.sin(p * 120) : 0), y);
      frame($('b2bear'), Math.floor(p * 60) % 3);
      // 腳印一路畫出來，三個小熊依序出現
      const d = seg(p, .3, .54);
      reveal($('b2steps'), seg(d, 0, .6));
      pop($('b2run1'), seg(d, .08, .2));
      pop($('b2run2'), seg(d, .28, .4));
      T($('b2ladder'), lerp(700, 0, out(seg(d, .48, .64))), 0); O($('b2ladder'), d > .48 ? 1 : 0);
      // 雙手托著小鳥往上，放進鳥巢後雙手張開
      const h = seg(p, .54, .78);
      const lift = 230 * (1 - E(seg(h, 0, .45)));
      const open = E(seg(h, .5, .85));
      T($('b2bird'), 0, lift);
      T($('b2handL'), lerp(210, 100, open), lift);
      T($('b2handR'), lerp(370, 480, open), lift);
      // 搖頭晃腦，冒出想法
      T($('b2head'), 0, 0, 1, 7 * Math.sin(p * 90));
      pop($('b2say'), seg(p, .83, .89));
    },
    act3(p) {
      // 背影沿著小路走回家：越遠越小，每一步左右搖擺、輕輕上下，最後走進門裡
      const w = seg(p, 0, .18);
      const houseY = lerp(199, 109, w);
      T($('c3cloud'), 0, lerp(-21, -91, w));
      T($('c3house'), 0, houseY);
      const wt = seg(w, 0, .92);                                  // 走路的進度
      const doorY = houseY + 360;                                  // 家門口的地面位置
      const feetY = doorY + (1060 - doorY) * Math.pow(1 - wt, 1.4);   // 腳從畫面下方一路走到門口
      const s = Math.max(.22, 1.15 * (feetY - 298) / 762);         // 透視：離地平線越近越小
      // 小路的中線（量自 book09_4：每個高度小路在哪個 x），小熊的腳永遠踩在路中間
      const road = [[1060,225],[973,213],[943,196],[913,181],[883,169],[853,158],[823,149],[793,143],[763,141],[733,148],[703,157],[673,169],[643,186],[613,206],[583,231],[553,290],[523,335],[466,405]];
      let cx = road[road.length - 1][1];
      for (let i = 0; i < road.length - 1; i++) {
        if (feetY >= road[i + 1][0]) { const [y0, x0] = road[i], [y1, x1] = road[i + 1]; cx = lerp(x1, x0, clamp((feetY - y1) / (y0 - y1))); break; }
      }
      if (feetY >= road[0][0]) cx = road[0][1];
      const step = wt * 8 * Math.PI;                               // 一共走 8 步
      const bob = Math.abs(Math.sin(step)) * 12 * s;
      T($('c3walk'), cx + 9 * s * Math.sin(step) - 167, feetY - 431 - bob, s, 4 * Math.sin(step));
      O($('c3walk'), 1 - seg(w, .92, 1));                          // 走到門口就進屋
      // 吊床午睡：先安靜地冒 Zzz、吊床輕輕搖 → 啪！一個一個彈出來，每一聲畫面都震一下、樹葉被震落
      const nap = seg(p, .18, .33);
      const paT = i => seg(nap, .3 + i * .1, .36 + i * .1);          // 第 i 聲「啪」
      let jolt = 0;
      for (let i = 0; i < 5; i++) { const t = paT(i); if (t > 0 && t < 1) jolt = Math.sin(t * Math.PI * 3) * (1 - t); }
      const calm = 1 - seg(nap, .28, .32);                           // 還沒被吵的程度
      T($('c3nap'), 10 * jolt, -12 - 8 * Math.abs(jolt), lerp(1.06, 1.1, E(nap)), 1.1 * Math.sin(nap * 9) * calm + 1.5 * jolt);
      root.querySelectorAll('.zz').forEach((el, i) => {
        const t = (nap * 5 + i * .33) % 1;
        T(el, 26 * t, -46 * t, .7 + .5 * t, -8 + 16 * t);
        O(el, Math.sin(t * Math.PI) * calm * seg(nap, 0, .05));
      });
      root.querySelectorAll('.pa').forEach((el, i) => {
        const t = paT(i), after = seg(nap, .36 + i * .1, 1);
        T(el, 0, 0, back(t) * (1 + .07 * Math.sin(after * 26 + i)), (i % 2 ? 7 : -7) * (1 - t) + 3 * Math.sin(after * 20 + i * 2));
        O(el, t > 0 ? 1 : 0);
      });
      root.querySelectorAll('.leaf').forEach((el, i) => {
        const t = seg(nap, .32 + (i % 5) * .1 + (i > 4 ? .05 : 0), .62 + (i % 5) * .1 + (i > 4 ? .05 : 0));
        T(el, 34 * Math.sin(t * 9 + i), lerp(150, 660, t), 1, 200 * t * (i % 2 ? 1 : -1));
        O(el, t > 0 && t < 1 ? Math.min(1, (1 - t) * 5) : 0);
      });
      // 華爾滋從躺著轉成坐起來，冒出驚嘆號
      const st = seg(p, .33, .46);
      T($('c3sit'), 0, 0, 1, lerp(-90, 0, E(seg(st, .15, .6))));
      pop($('c3wow'), seg(st, .62, .78));
      // 跳繩：兩格交替＋小跳
      const r = seg(p, .46, .62);
      T($('c3cloud2'), 0, lerp(-30, -60, r));
      T($('c3hill'), 0, lerp(230, 180, E(r)));
      T($('c3grass'), 0, lerp(463, 333, E(r)));
      frame($('c3rope'), Math.floor(p * 70) % 2);
      T($('c3rope'), 0, lerp(493, 528, E(r)) - 18 * Math.abs(Math.sin(p * 35 * Math.PI)));
      // 聽說跳 50 下會長高：只有拿跳繩的小熊在跳
      const k = seg(p, .62, .76);
      const talk = seg(k, .4, .55);
      O($('c3talk'), talk); O($('c3bubble'), talk);
      const ph = k > 0 && k < 1 ? (k * 6) % 1 : 0;
      const hgt = Math.sin(ph * Math.PI);
      const land = ph <= 0 ? 0 : ph < .12 ? 1 - ph / .12 : ph > .88 ? (ph - .88) / .12 : 0;
      const j = $('c3jump');
      if (j) j.style.transform = `translate3d(0,${(-46 * hgt).toFixed(1)}px,0) scale(${(1 + .05 * land).toFixed(3)},${(1 - .06 * land).toFixed(3)})`;
      const sh = $('c3shadow');
      if (sh) { sh.style.transform = `scale(${(1 - .3 * hgt).toFixed(3)})`; sh.style.opacity = (1 - .45 * hgt).toFixed(3); }
      // 出去玩？不行～
      O($('c3no'), seg(p, .81, .83));
      // 三格運動一格格出現
      [1, 2, 3].forEach(i => {
        const t = seg(p, .87 + (i - 1) * .03, .9 + (i - 1) * .03);
        T($('c3p' + i), 0, 60 * (1 - out(t))); O($('c3p' + i), t);
      });
      T($('c3swim'), 0, 0, 1, 8 * Math.sin(p * 120));
    },
    act4(p) {
      pop($('d4ask'), seg(p, .03, .08));
      pop($('d4help'), seg(p, .15, .2));
      O($('d4dusk'), seg(p, .29, .35));                                                       // 從白天讀到傍晚
      T($('d4book'), 0, -540 * E(seg(p, .42, .64)));
      root.querySelectorAll('#d4book .ic').forEach((el, i) => { const k = back(seg(p, .47 + i * .04, .51 + i * .04)); T(el, 0, 0, k); O(el, k > 0 ? 1 : 0); });

      rise:     () => tone(r(260, 320), r(1100, 1400), r(.5, .65), 'sine', .18, 0, { vib: 8, depth: 18, rv: .15 }),
      chirp:    () => { const n = 2 + Math.floor(Math.random() * 3), b = r(2000, 2600); for (let i = 0; i < n; i++) tone(b + i * r(80, 200), b * r(1.3, 1.6), r(.06, .09), 'sine', .2, i * r(.09, .13), { pan: rp(), rv: .2 }); },
      clap:     () => { if (smp('clap', .85, { pan: rp(), rv: .2 })) return; noise(r(.1, .14), r(1600, 2200), 1100, 1.5, .6, 0, 'bandpass', { rv: .25, pan: rp() }); noise(.03, 4200, 3000, 1, .3, 0, 'bandpass', { rv: .2 }); tone(r(170, 210), 70, .09, 'sine', .3, 0, { rv: .1 }); },
      snore:    () => { tone(r(85, 105), 66, r(.5, .65), 'sawtooth', .05, 0, { vib: 22, depth: 6, rv: .1 }); noise(.5, 1500, 2500, 2, .03, .6, 'bandpass', { att: .2, rv: .2 }); },
      jump:     () => { tone(r(230, 300), r(600, 760), r(.12, .16), 'sine', .22, 0, { rv: .1 }); noise(.1, 2200, 700, 1, .1, .02, 'bandpass', { pan: rp(), rv: .1 }); smp('land', .5, { delay: .14 }); },
      nope:     () => { tone(330, 290, .18, 'square', .09, 0, { vib: 14, depth: 10, rv: .1 }); tone(247, 200, .32, 'square', .09, .2, { vib: 10, depth: 12, rv: .1 }); tone(123, 100, .32, 'sine', .2, .2, { rv: .1 }); },
      idea:     () => { tone(392, 392, .1, 'triangle', .2, 0, { rv: .15 }); tone(587, 587, .1, 'triangle', .2, .1, { rv: .15 }); tone(784, 784, .22, 'triangle', .22, .2, { rv: .2 }); },   // 想到了！三個短音往上
      tick:     () => smp('knock', .4, { rate: r(1.3, 1.5), rv: .05 }) || tone(r(1500, 1900), 1200, .03, 'square', .06, 0, { rv: .05 }),
      page:     () => { if (smp('page', .85, { pan: rp(), rv: .1 })) return; noise(r(.18, .24), r(3000, 3800), 700, .8, .2, 0, 'bandpass', { pan: -.4, rv: .15 }); noise(.08, 900, 2400, 1, .08, .14, 'bandpass', { pan: .4, rv: .1 }); },
      stir:     () => { noise(r(.16, .22), r(350, 500), r(700, 900), 2, .2, 0, 'bandpass', { pan: rp(), rv: .1 }); tone(r(300, 380), 220, .05, 'triangle', .14, .12, { rv: .05 }); },   // 攪麵糊：稠稠的一圈＋木匙輕碰
      surprise: () => tone(r(380, 460), r(1300, 1600), r(.15, .19), 'triangle', .22, 0, { rv: .15 }),
      pour:     () => {
        noise(1.25, 800, 1900, 2, .2, 0, 'bandpass', { att: .12, rv: .2 });
        noise(1.25, 2500, 4200, 3, .06, 0, 'bandpass', { att: .12, pan: .4, rv: .1 });
        for (let i = 0; i < 12; i++) tone(r(350, 850), r(800, 1400), .05, 'sine', .09, .08 + i * .09, { pan: rp(), rv: .1 });
      },
      squeeze:  () => { noise(r(.13, .17), r(450, 600), r(1500, 1900), 3, .28, 0, 'bandpass', { rv: .1 }); tone(r(200, 250), r(500, 620), .11, 'sine', .16, 0, { rv: .05 }); tone(r(650, 800), r(1000, 1200), .05, 'sine', .22, .13, { rv: .05 }); },
      firework: () => {
        const pan = rp() * 1.6;
        tone(r(450, 550), r(2000, 2600), r(.34, .42), 'sine', .1, 0, { vib: 30, depth: 60, pan, rv: .2 });                    // 咻——升空
        noise(.5, 3200, 300, .6, .38, .38, 'bandpass', { pan, rv: .45 }); tone(140, 45, .3, 'sine', .4, .38, { pan, rv: .3 });   // 砰
        for (let i = 0; i < 10; i++) noise(.03, r(3000, 7000), 2000, 2, r(.05, .12), .5 + Math.random() * .6, 'bandpass', { pan: pan + rp(), rv: .3 });   // 劈啪（短促的碎響，不是鈴聲）
      },
      tada:     () => {
        [392, 523.25, 659.25, 783.99].forEach((f, i) => tone(f, f, .16, 'triangle', .2, i * .08, { pan: -.3 + i * .2, rv: .2 }));          // 四個短音往上
        [523.25, 659.25, 783.99].forEach(f => { tone(f, f, .6, 'triangle', .14, .34, { rv: .3 }); tone(f * 1.003, f * 1.003, .6, 'sawtooth', .025, .34, { rv: .3 }); });  // 收尾和弦（短）
        tone(65, 65, .5, 'sine', .28, .34, { rv: .1 });
      },
    };
    // 連續音：一直在背景跑、平常音量是 0，捲動時才依捲動速度放大（停下來就停）
    const BED = {
      wind: { type: 'bandpass', f: 420, q: .8,  max: .26, rv: .3 },    // 第 1 幕鏡頭穿過森林的風
      stir: { type: 'bandpass', f: 650, q: 2.6, max: .34, rv: .08 },   // 第 5 幕攪拌麵糊，濾波器來回掃，像湯匙一圈一圈
      pour: { type: 'highpass', f: 3800, q: .7, max: .2,  rv: .2 },    // 第 5 幕倒鈣粉的沙沙聲
    };
    const beds = {};
    let bedBuf = null;
    const bed = name => {
      if (beds[name]) return beds[name];
      if (!bedBuf) {                                         // 3 秒長的雜訊，循環時比較聽不出重複
        bedBuf = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate);
        const d = bedBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const c = BED[name], n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      n.buffer = bedBuf; n.loop = true; f.type = c.type; f.frequency.value = c.f; f.Q.value = c.q; g.gain.value = 0;
      n.connect(f).connect(g); g.connect(master);
      if (c.rv) { const w = ctx.createGain(); w.gain.value = c.rv; g.connect(w); w.connect(wet); }
      n.start(0, Math.random() * 3);
      return beds[name] = { f, g, c };
    };
    const hush = () => Object.values(beds).forEach(b => b.g.gain.setTargetAtTime(0, ctx.currentTime, .05));
    let played = [];                                         // 最近播過的音效名稱（測試用）
    return {
      get on() { return on; },
      get played() { return played; },
      get names() { return Object.keys(lib); },
      get running() { return !!ctx && ctx.state === 'running'; },
      pause() { if (ctx && ctx.state === 'running') { hush(); ctx.suspend(); } },
      get samples() { return Object.fromEntries(Object.entries(buf).map(([k, L]) => [k, L.length])); },   // 測試用：每組讀進幾個錄音
      toggle(want) {                                         // want 省略 = 切換；true / false = 指定開關
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          const comp = ctx.createDynamicsCompressor();       // 很多聲音疊在一起時不會爆音
          comp.threshold.value = -14; comp.ratio.value = 6; comp.connect(ctx.destination);
          master = ctx.createGain(); master.gain.value = .75; master.connect(comp);   // .75 = 音效總音量
          noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
          const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          // 殘響：用程式做一段 1.1 秒、慢慢變小的立體聲雜訊當作空間回音
          const len = Math.floor(ctx.sampleRate * 1.1), ir = ctx.createBuffer(2, len, ctx.sampleRate);
          for (let c = 0; c < 2; c++) { const ch = ir.getChannelData(c); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
          const conv = ctx.createConvolver(); conv.buffer = ir;
          wet = ctx.createGain(); wet.gain.value = .3; wet.connect(conv); conv.connect(master);
          loadSamples();
        }
        on = want === undefined ? !on : !!want;
        if (on) { ctx.resume(); if (want === undefined) lib.pop(); } else hush();
        return on;
      },
      // level 0~1：音量比例；fm：濾波頻率倍數（用來做攪拌的來回感）
      bed(name, level, fm = 1) {
        if (!on || !ctx || ctx.state !== 'running' || !BED[name]) return;
        if (!beds[name] && level < .01) return;              // 還沒用到的就先不建立
        const b = bed(name), t = ctx.currentTime;
        b.g.gain.setTargetAtTime(b.c.max * Math.max(0, Math.min(1, level)), t, .07);
        b.f.frequency.setTargetAtTime(b.c.f * fm, t, .04);
      },
      get beds() { return Object.fromEntries(Object.entries(beds).map(([k, b]) => [k, +b.g.gain.value.toFixed(3)])); },
      play(name) { if (on && ctx && ctx.state === 'running' && lib[name]) { try { lib[name](); played.push(name); if (played.length > 40) played.shift(); } catch (e) { console.error('sfx', name, e); } } },
    };
  })();
  window.__sfx = SFX;
  // 每一幕：捲到哪個進度，哪個物件發出什麼聲音
  const CUES = {
    // 散步：開場風聲、進森林樹葉沙沙、小熊出現、小鳥叫著掉下來、落地；抬頭看鳥巢時樹葉聲和鳥叫
    act1: [[.345, 'rustle'], [.4, 'pop'], [.475, 'chirp'], [.5, 'slide'], [.585, 'chirp'], [.64, 'thud'],
           [.7, 'rustle'], [.8, 'chirp'], [.93, 'rustle']],
    // 送小鳥回家：爬樹、滑下來、落地；夥伴出現、梯子；托起小鳥、放回鳥巢後鳥叫；冒出想法
    act2: [[.02, 'step'], [.055, 'step'], [.09, 'step'], [.15, 'slide'], [.295, 'thud'], [.319, 'pop'], [.367, 'pop'], [.415, 'whoosh'],
           [.55, 'rise'], [.67, 'chirp'], [.83, 'pop']],
    // 想長高：走回家、進門；打呼、五聲啪、落葉、坐起來、驚嘆號；跳繩；對話；不行；三格運動
    act3: [[.02, 'step'], [.041, 'step'], [.062, 'step'], [.083, 'step'], [.1035, 'step'], [.124, 'step'], [.145, 'step'], [.166, 'door'],
           [.19, 'snore'], [.21, 'snore'], [.225, 'clap'], [.24, 'clap'], [.255, 'clap'], [.262, 'rustle'], [.27, 'clap'], [.285, 'clap'],
           [.35, 'whoosh'], [.41, 'surprise'],
           [.4571, 'jump'], [.4857, 'jump'], [.5143, 'jump'], [.5429, 'jump'], [.5714, 'jump'], [.6, 'jump'],
           [.643, 'jump'], [.676, 'pop'], [.69, 'jump'], [.737, 'jump'],
           [.815, 'nope'], [.87, 'pop'], [.9, 'pop'], [.93, 'pop']],
    // 找方法：問、幫忙；翻書；書頁圖示；別的方法；燈泡閃兩下後想到了
    act4: [[.03, 'pop'], [.15, 'pop'], [.24, 'page'], [.34, 'page'], [.42, 'page'], [.47, 'tick'], [.51, 'tick'], [.55, 'tick'], [.59, 'tick'],
           [.7, 'pop'], [.8, 'pop'], [.84, 'tick'], [.855, 'tick'], [.87, 'idea'], [.94, 'whoosh']],
    // 調配：推進門口；攪拌；開瓶、倒鈣；出爐、擠餅乾、完成
    act5: [[.06, 'whoosh'], [.44, 'pop'], [.705, 'whoosh'],
           [.76, 'squeeze'], [.78, 'squeeze'], [.8, 'squeeze'], [.82, 'squeeze'], [.84, 'squeeze'], [.86, 'squeeze'], [.885, 'tada']],
    // 分享：做好了、開心跳；出門；煙火；對話；揮旗；結尾
    act6: [[.03, 'tada'], [.08, 'jump'], [.12, 'jump'], [.21, 'whoosh'], [.3, 'firework'], [.34, 'firework'], [.375, 'pop'], [.44, 'firework'],
           [.49, 'whoosh'], [.55, 'whoosh'], [.6, 'pop'], [.87, 'tada']],
  };
  const prevP = {};
  function sfxAt(id, p) {
    const q = prevP[id]; prevP[id] = p;
    if (!SFX.on || q == null || p <= q) return;            // 只在往下捲時出聲，往回捲不重播
    const hit = (CUES[id] || []).filter(c => c[0] > q && c[0] <= p);
    if (hit.length > 3) SFX.play(hit[hit.length - 1][1]);   // 一次跳過一大段（例如點章節）：只播最後一個，不要一口氣全部響
    else hit.forEach(c => SFX.play(c[1]));
  }
  // 互動音效：點章節、「再看一次」各有自己的聲音
  document.querySelectorAll('.chapters button').forEach(b => b.addEventListener('click', () => SFX.play('whoosh')));
  if ($('again')) $('again').addEventListener('click', () => SFX.play('rise'));
  // 背景音樂：原版的 Koala_0205.mp3，小小聲循環播放，跟聲音按鈕一起開關；開關時淡入淡出
  const BGM_VOL = .07;                                    // 背景音樂音量（0~1），想大聲一點就調這個
  let bgmTimer = 0;
  function bgmFade(on) {
    const a = $('bgm'); if (!a) return;
    clearInterval(bgmTimer);
    if (on) { if (a.paused) { a.volume = 0; a.play().catch(() => {}); } }
    bgmTimer = setInterval(() => {
      const to = on ? BGM_VOL : 0, v = a.volume + Math.sign(to - a.volume) * .01;
      if (Math.abs(to - a.volume) <= .011) { a.volume = to; clearInterval(bgmTimer); if (!on) a.pause(); }
      else a.volume = Math.max(0, Math.min(1, v));
    }, 40);
  }
  // 聲音預設開啟。瀏覽器規定「使用者碰過頁面」之前不准出聲，所以先試著直接開；
  // 被擋下的話，等第一次點擊、觸碰或按鍵再開（滾輪不算），按鈕一直顯示「開」。
  const sndBtn = $('snd');
  const bgmEl = $('bgm');
  const audible = () => SFX.running && (!bgmEl || !bgmEl.paused);
  const showSnd = on => {
    sndBtn.setAttribute('aria-pressed', on);
    sndBtn.textContent = on ? '🔊 聲音：開' : '🔇 聲音：關';
  };
  function startAudio() { SFX.toggle(true); bgmFade(true); showSnd(true); }
  function unlockAudio(e) {
    if (e.target.closest && e.target.closest('#snd')) return;   // 按鈕自己的點擊另外處理
    if (SFX.on && !audible()) startAudio();
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(t => addEventListener(t, unlockAudio, true));
  sndBtn.addEventListener('click', () => {
    if (SFX.on && !audible()) { startAudio(); return; }          // 顯示「開」卻還沒出聲：這一下是在幫它開，不是關掉
    const on = SFX.toggle();
    showSnd(on);
    bgmFade(on);
  });
  startAudio();
  // 切到別的分頁、縮小視窗時，音樂和音效先暫停；回來再接著播
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (bgmEl) bgmEl.pause(); SFX.pause(); }
    else if (SFX.on) startAudio();
  });

  // 連續音：每一格都算捲動速度，在對應的段落裡依速度放大音量；不捲就安靜下來
  let bedSy = scrollY, spd = 0, stirPh = 0;
  function updateBeds(y) {
    const d = Math.abs(y - bedSy); bedSy = y;
    spd += (Math.min(1, d / 22) - spd) * .25;             // 每格捲 22px 以上算最快
    stirPh += d * .035;
    const vh = innerHeight;
    const pOf = id => { const a = info.find(x => x.el.id === id); return a ? (y - a.top) / (a.h - vh) : -1; };
    const win = (p, a, b) => (p > a && p < b) ? Math.min(1, (p - a) / .02, (b - p) / .02) : 0;   // 段落頭尾 2% 淡入淡出
    const p1 = pOf('act1'), p5 = pOf('act5');
    SFX.bed('wind', spd * win(p1, -.02, .45), .75 + spd * .9);
    SFX.bed('stir', spd * win(p5, .18, .39), 1 + .4 * Math.sin(stirPh));
    const pr = vid.ready ? [.43 + .25 * VID.pourFrom / VID.end, .43 + .25 * VID.pourTo / VID.end] : [.5, .65];
    SFX.bed('pour', spd * win(p5, pr[0], pr[1]), .9 + spd * .5);
  }

  /* ---------- 主迴圈：捲軸位置 → 每一幕的進度 → 畫面 ---------- */
  let sy = scrollY, last = -1, current = -1;
  function tick() {
    if (Math.abs(ptr.tx - ptr.x) > .001 || Math.abs(ptr.ty - ptr.y) > .001) {
      ptr.x += (ptr.tx - ptr.x) * .08; ptr.y += (ptr.ty - ptr.y) * .08;   // 慢慢跟上，有漂浮感
      document.documentElement.style.setProperty('--mx', ptr.x.toFixed(4));
      document.documentElement.style.setProperty('--my', ptr.y.toFixed(4));
    }
    const target = scrollY;
    sy = reduce ? target : sy + (target - sy) * 0.18;     // 輕微平滑，讓動作不會一格一格跳
    if (Math.abs(target - sy) < 0.3) sy = target;
    updateBeds(sy);
    if (sy !== last) {
      last = sy;
      const vh = innerHeight;
      info.forEach((a, i) => {
        if (sy + vh < a.top - vh || sy > a.top + a.h) return;  // 離太遠的幕不計算
        const p = clamp((sy - a.top) / (a.h - vh));
        runners[a.el.id](p);
        sfxAt(a.el.id, p);
      });
      const mid = sy + vh / 2;
      const idx = Math.max(0, info.findIndex(a => mid >= a.top && mid < a.top + a.h));
      if (idx !== current) {
        current = idx;
        btns.forEach((b, i) => b.classList.toggle('on', i === idx));
      }
      const max = document.documentElement.scrollHeight - vh;
      $('bar').style.width = (100 * sy / Math.max(1, max)).toFixed(2) + '%';
      // 字幕
      info.forEach(a => {
        const p = clamp((sy - a.top) / (a.h - vh));
        a.el.querySelectorAll('.cap[data-in]').forEach(c => {
          const o = seg(p, +c.dataset.in, +c.dataset.in + .03) * (1 - seg(p, +c.dataset.out - .03, +c.dataset.out));
          c.style.opacity = o;
          c.style.transform = `translate(-50%, ${((1 - o) * 14).toFixed(1)}px)`;
        });
      });
    }
    requestAnimationFrame(tick);
  }

  addEventListener('resize', () => { layout(); last = -1; });
  addEventListener('load', () => { layout(); last = -1; });
  layout();
  acts.forEach(a => runners[a.id](0));
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
